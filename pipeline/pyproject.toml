[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chch-pipeline"
version = "0.0.1"
description = "Ingest, validate and reproject Christchurch geotechnical data."
requires-python = ">=3.11"
dependencies = [
    "pyproj>=3.6",
    "geopandas>=1.0",
    "rasterio>=1.4",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Mostly an HTML/CSS/JS template; wrapping it would hurt readability.
"src/chch_pipeline/page.py" = ["E501"]
